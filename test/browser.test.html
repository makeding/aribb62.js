<!doctype html>
<meta charset="utf-8">
<title>aribb62.js browser tests</title>
<pre id="result">RUNNING</pre>
<script>
addEventListener('error', (event) => {
    document.getElementById('result').textContent = 'FAIL: ' + (event.error && event.error.stack || event.message);
});
addEventListener('unhandledrejection', (event) => {
    document.getElementById('result').textContent = 'FAIL: ' + (event.reason && event.reason.stack || event.reason);
});
</script>
<script type="module">
import {parseARIBTTMLDocument} from '../src/parser.js';
import {B62TTMLRenderer} from '../src/index.js';

const assert = (condition, message) => {
    if (!condition) {
        throw new Error(message);
    }
};

const sizeOverlay = (overlay) => {
    overlay.style.position = 'relative';
    overlay.style.width = '384px';
    overlay.style.height = '216px';
};

const invalid = parseARIBTTMLDocument('<tt><broken></tt>', 0, 0, false);
assert(invalid.kind === 'invalid', 'malformed XML must not become a clear command');

const clear = parseARIBTTMLDocument(
    '<tt xmlns="http://www.w3.org/ns/ttml">\n</tt>',
    0,
    0,
    false
);
assert(clear.kind === 'clear', 'an empty tt element must be a clear command');

const emptyPresentation = parseARIBTTMLDocument(
    '<tt xmlns="http://www.w3.org/ns/ttml"><head/><body/></tt>',
    0,
    0,
    false
);
assert(emptyPresentation.kind === 'presentation', 'a structured empty document is not the B62 empty-tt command');

const sourceText = `
<tt xmlns="http://www.w3.org/ns/ttml" tts:extent="3840px 2160px"
    xmlns:tts="http://www.w3.org/ns/ttml#styling"
    xmlns:arib-tt="http://www.arib.or.jp/ns/arib-ttml/v1_0">
  <head><layout><region xml:id="r" tts:origin="0px 0px" tts:extent="3840px 2160px"/></layout></head>
  <body><div><p xml:id="p4" region="r" begin="00:00:10.000" end="indefinite" arib-tt:border="solid 4px white"><span tts:fontSize="50px 100px">old content</span></p></div></body>
</tt>`;
const source = parseARIBTTMLDocument(sourceText, 0, 0, false);
assert(source.cues.length === 1 && source.cues[0].end === Infinity, 'source indefinite cue');
assert(source.cues[0].blocks[0].xmlId === 'p4', 'p xml:id must survive parsing');

const continuationText = `
<tt xmlns="http://www.w3.org/ns/ttml">
  <body><div><p xml:id="p4" begin="indefinite" end="00:00:50.000"><span>replacement must be ignored</span></p></div></body>
</tt>`;
const continuation = parseARIBTTMLDocument(continuationText, 0, 20, false, {timelineOffset: 2});
assert(continuation.cues.length === 0, 'continuation node must not become a new visual cue');
assert(continuation.continuations[0].end === 52, 'continuation end must use the track timeline offset');

const media = document.createElement('video');
Object.defineProperty(media, 'currentTime', {value: 20, writable: true});
const overlay = document.createElement('div');
sizeOverlay(overlay);
document.body.append(media, overlay);
const renderer = new B62TTMLRenderer({mediaElement: media, overlayElement: overlay, isLive: true});
renderer.push({packetId: 1, mpuSequenceNumber: 1, text: sourceText});
const widthWrapper = overlay.querySelector('[data-aribb62-font-width-ratio]');
assert(widthWrapper, 'two-value fontSize must create a width-aware glyph wrapper');
assert(widthWrapper.firstElementChild.style.transform === 'scaleX(0.5)', 'font width/height ratio must scale glyphs');
assert(parseFloat(widthWrapper.style.width) > 0, 'font width scaling must also update layout advance');
const renderedBlock = overlay.querySelector('.ttml-subtitle-block');
const renderedLine = overlay.querySelector('.ttml-subtitle-line');
assert(renderedBlock.style.border === '', 'p border must not become a region border');
assert(renderedLine.style.border.includes('solid'), 'p border must enclose the character sequence');
assert(widthWrapper.style.border === '', 'p border must not be copied onto every span');
const continuedResult = renderer.push({packetId: 1, mpuSequenceNumber: 2, text: continuationText});
assert(continuedResult.cues.length === 1, 'renderer must resolve a live continuation');
assert(continuedResult.cues[0].blocks[0].spans[0].text === 'old content', 'old DOM content must win');
renderer.push({packetId: 1, mpuSequenceNumber: 3, text: '<tt><broken></tt>'});
assert(renderer._state.activeCues(20).length === 1, 'malformed XML must leave the active presentation intact');
const invalidUtf8 = renderer.push({
    packetId: 1,
    mpuSequenceNumber: 4,
    data: new Uint8Array([0x3c, 0x74, 0x74, 0x3e, 0xc3, 0x28])
});
assert(invalidUtf8.documentKind === 'invalid', 'malformed UTF-8 must be rejected');
assert(renderer._state.activeCues(20).length === 1, 'malformed UTF-8 must leave the active presentation intact');
renderer.destroy();

const verticalText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling"
    xmlns:arib-tt="http://www.arib.or.jp/ns/arib-ttml/v1_0">
  <head><layout><region xml:id="v" tts:writingMode="tbrl" tts:origin="0px 0px" tts:extent="400px 1000px"/></layout></head>
  <body><div><p region="v" begin="0s" end="10s" arib-tt:marquee="slide forward fast 1">vertical</p></div></body>
</tt>`;
const verticalMedia = document.createElement('video');
const verticalOverlay = document.createElement('div');
sizeOverlay(verticalOverlay);
document.body.append(verticalMedia, verticalOverlay);
const verticalRenderer = new B62TTMLRenderer({mediaElement: verticalMedia, overlayElement: verticalOverlay});
verticalRenderer.push({packetId: 2, text: verticalText});
assert(
    verticalOverlay.querySelector('.ttml-subtitle-line').style.animationName === 'aribb62-marquee-slide-y-forward',
    'region writing mode must select the vertical marquee axis'
);
verticalRenderer.destroy();

const styleAndRubyText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling"
    xmlns:arib-tt="http://www.arib.or.jp/ns/arib-tt">
  <head><layout><region xml:id="r" tts:origin="0px 0px" tts:extent="3840px 2160px"/></layout></head>
  <body><div xml:id="base-div">
    <p xml:id="base-p" region="r" begin="0s" end="10s">
      <span xml:id="base"><span tts:textOutline="#00ff00ff 2px 1px"
        arib-tt:text-shadow="1px 1px 0px #000000">基</span>文</span>
      <span tts:textOutline="none">no-outline</span>
      <span tts:color="#ff0000" tts:textOutline="2px">current-outline</span>
    </p>
    <p region="r" begin="0s" end="10s"><span arib-tt:ruby="base">き</span><span arib-tt:ruby="base">ぶん</span></p>
  </div>
  <div arib-tt:ruby="base-div"><p arib-tt:ruby="base-p" region="r" begin="0s" end="10s">全体ルビ</p></div>
  <div><p xml:id="p-target" region="r" begin="0s" end="10s">段落基文</p>
    <p region="r" begin="0s" end="10s"><span arib-tt:ruby="p-target">span-to-p</span></p>
    <p arib-tt:ruby="base" region="r" begin="0s" end="10s">p-to-span</p>
    <p region="r" begin="0s" end="10s"><span arib-tt:ruby="later">before</span></p>
    <p region="r" begin="0s" end="10s"><span xml:id="later">later</span><span arib-tt:ruby="missing">unresolved</span></p>
  </div></body>
</tt>`;
const styleAndRuby = parseARIBTTMLDocument(styleAndRubyText, 0, 0, false);
const rubyBlocks = styleAndRuby.cues[0].blocks;
const baseSpan = rubyBlocks[0].spans.find((span) => span.id === 'base');
assert(baseSpan.rubyAnnotations.length === 3, 'cross-p and cross-type ruby annotations must be preserved');
assert(baseSpan.rubyAnnotations[0].text === 'き' && baseSpan.rubyAnnotations[1].text === 'ぶん', 'ruby metadata text');
assert(rubyBlocks[0].rubyAnnotations[0].text === '全体ルビ', 'div/p ruby association metadata');
const pTarget = rubyBlocks.find((block) => block.xmlId === 'p-target');
assert(pTarget.rubyAnnotations[0].text === 'span-to-p', 'span annotation must resolve a p target');
const nestedAnnotation = rubyBlocks.find((block) => block.spans.some((span) => span.text === '全体ルビ'));
assert(nestedAnnotation.rubyTargetIds.length === 2, 'nested div and p ruby relations must both survive');
const laterSpan = rubyBlocks.flatMap((block) => block.spans).find((span) => span.id === 'later');
assert(laterSpan.rubyAnnotations[0].text === 'before', 'annotation-before-base must resolve document-wide');
const unresolved = rubyBlocks.flatMap((block) => block.spans).find((span) => span.text === 'unresolved');
assert(!unresolved.rubyResolved, 'an unresolved ruby relation must remain ordinary visible text');
const spanRuby = rubyBlocks.flatMap((block) => block.spans).find((span) => span.text === 'き');
const blockRuby = rubyBlocks.flatMap((block) => block.spans).find((span) => span.text === '全体ルビ');
assert(spanRuby.isRuby && blockRuby.isRuby, 'span and block ruby descendants must be classified as ruby');

const styleMedia = document.createElement('video');
Object.defineProperty(styleMedia, 'currentTime', {value: 0, writable: true});
const styleOverlay = document.createElement('div');
sizeOverlay(styleOverlay);
document.body.append(styleMedia, styleOverlay);
const styleRenderer = new B62TTMLRenderer({
    mediaElement: styleMedia,
    overlayElement: styleOverlay,
    smallScreenScale: false
});
styleRenderer.push({packetId: 3, text: styleAndRubyText});
assert(styleOverlay.textContent.includes('き') && styleOverlay.textContent.includes('ぶん'), 'ruby annotations must not be removed from broadcaster layout');
assert(styleOverlay.querySelectorAll('ruby').length === 0, 'TR-B39 ruby metadata must not force HTML ruby layout');
assert(styleOverlay.querySelectorAll('[data-aribb62-ruby]').length > 0, 'ruby annotations must remain distinguishable in the DOM');
const outlined = Array.from(styleOverlay.querySelectorAll('span')).find((span) => span.textContent === '基');
assert(outlined.style.webkitTextStroke.includes('0.2px'), 'textOutline must retain subpixel plane scaling');
assert(
    outlined.style.webkitTextStroke.includes('rgb(0, 255, 0)') || outlined.style.webkitTextStroke.includes('#00ff00'),
    'textOutline color: ' + outlined.style.webkitTextStroke
);
const noOutline = Array.from(styleOverlay.querySelectorAll('span')).find((span) => span.textContent === 'no-outline');
assert(noOutline.style.webkitTextStroke.startsWith('0px'), 'textOutline none must suppress the viewer fallback stroke');
const currentOutline = Array.from(styleOverlay.querySelectorAll('span')).find((span) => span.textContent === 'current-outline');
assert(currentOutline.style.webkitTextStroke.includes('currentcolor'), 'textOutline without a color must use currentColor');
assert(
    outlined.style.textShadow.includes('0.1px 0.1px 0px') &&
        outlined.style.textShadow.includes('0px 0px 0.1px'),
    'textOutline blur must compose with text-shadow: ' + outlined.style.textShadow
);
assert(styleOverlay.querySelector('.ttml-subtitle-block').style.overflow === 'hidden', 'TR-B39 overflow must always clip');
assert(styleOverlay.querySelector('.ttml-subtitle-block').style.width === '384px', 'stroke must not expand the region clipping box');
styleRenderer.destroy();

const regionStyleReference = parseARIBTTMLDocument(`
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling">
  <head><styling><style xml:id="position" tts:origin="120px 80px" tts:extent="640px 180px"/></styling>
    <layout><region xml:id="styled-region" style="position"/></layout></head>
  <body><div><p region="styled-region" begin="0s" end="1s">styled region</p></div></body>
</tt>`, 0, 0, false);
assert(
    regionStyleReference.cues[0].blocks[0].region.origin[0] === 120 &&
        regionStyleReference.cues[0].blocks[0].region.extent[1] === 180,
    'region origin and extent must resolve through a style reference'
);

const scrollingText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling"
    xmlns:arib-tt="http://www.arib.or.jp/ns/arib-tt">
  <head><styling>
    <arib-tt:keyframes animationName="scroll">
      <arib-tt:keyframe position="0%" tts:origin="340px 40px"/>
      <arib-tt:keyframe position="100%" tts:origin="40px 40px"/>
    </arib-tt:keyframes>
    <style xml:id="s1" tts:fontSize="46px"/>
    <style xml:id="s2" arib-tt:animation="scroll 1000ms linear 0ms 1 normal"/>
    <style xml:id="s3" tts:color="#ff0000"/>
  </styling><layout>
    <region xml:id="r1" style="s1" tts:origin="40px 40px" tts:extent="300px 100px"/>
    <region xml:id="r2" style="s2" tts:origin="40px 40px" tts:extent="300px 100px"/>
    <region xml:id="r3" tts:origin="100px 40px" tts:extent="100px 100px"/>
  </layout></head>
  <body><div><p region="r1" begin="0s" end="10s"><span region="r2">scrolling<br/>second line</span><span region="r3">other region</span><span region="r2" style="s3"> sibling</span></p></div></body>
</tt>`;
const scrolling = parseARIBTTMLDocument(scrollingText, 0, 0, false);
const scrollingSpan = scrolling.cues[0].blocks[0].spans[0];
assert(scrollingSpan.region.origin[0] === 40, 'span region origin must survive parsing');
assert(
    scrolling.cues[0].blocks[0].spans.filter((span) => span.regionGroupId === scrollingSpan.regionGroupId).length === 4,
    'all content assigned to one resolved region must keep one layout group'
);
assert(
    scrollingSpan.style.animation && scrollingSpan.style.animation.startsWith('scroll '),
    'span region style must supply animation: ' + JSON.stringify(scrollingSpan)
);

const animationMedia = document.createElement('video');
Object.defineProperty(animationMedia, 'currentTime', {value: 0, writable: true});
const animationOverlay = document.createElement('div');
sizeOverlay(animationOverlay);
document.body.append(animationMedia, animationOverlay);
const animationRenderer = new B62TTMLRenderer({
    mediaElement: animationMedia,
    overlayElement: animationOverlay,
    fallbackStrokeColor: false,
    smallScreenScale: false
});
animationRenderer.push({packetId: 4, text: scrollingText});
const animationSpan = animationOverlay.querySelector('.ttml-subtitle-line > span');
const animationStyle = animationOverlay.querySelector('style').textContent;
assert(animationSpan.style.getPropertyValue('--aribb62-origin-x') === '4px', 'animated span base origin');
assert(animationSpan.style.animationName.startsWith('aribb62-'), 'keyframe names must be presentation scoped');
assert(animationSpan.hasAttribute('data-aribb62-region-group') && animationSpan.children.length === 4, 'multi-line and sibling spans in one region must share one positioned wrapper');
assert(animationSpan.textContent === 'scrolling\nsecond linesibling', 'same-region sibling spans must retain flow order');
assert(animationSpan.lastElementChild.style.color === 'rgb(255, 0, 0)', 'same-region sibling spans must retain their direct style');
assert(animationOverlay.querySelectorAll('[data-aribb62-region-group]').length === 2, 'non-contiguous content must still form one wrapper per resolved region');
assert(animationOverlay.querySelector('.ttml-subtitle-block').style.left === '4px' && animationOverlay.querySelector('.ttml-subtitle-block').style.width === '30px', 'clip region geometry must remain exact');
assert(animationStyle.includes('calc(34px - var(--aribb62-origin-x, 0px))'), 'absolute keyframe origin must subtract the span region origin');
let bbox = animationSpan.getBoundingClientRect();
let overlayBox = animationOverlay.getBoundingClientRect();
assert(Math.abs((bbox.left - overlayBox.left) - 34) < 1, 'animation 0% pixel position must be the absolute plane origin');
animationMedia.currentTime = 0.5;
animationRenderer.render();
const animation = animationSpan.getAnimations()[0];
assert(animation && Math.abs(animation.currentTime - 500) < 1, 'CSS animation must follow media time');
bbox = animationSpan.getBoundingClientRect();
overlayBox = animationOverlay.getBoundingClientRect();
assert(Math.abs((bbox.left - overlayBox.left) - 19) < 1, 'animation midpoint pixel position');
animationMedia.currentTime = 1;
animationRenderer.render();
bbox = animationSpan.getBoundingClientRect();
assert(Math.abs((bbox.left - overlayBox.left) - 4) < 1, 'animation 100% pixel position');
animationMedia.currentTime = 0;
animationRenderer.push({packetId: 5, text: scrollingText});
const scopedKeyframes = Array.from(animationOverlay.querySelectorAll('style')).map((style) => {
    const match = style.textContent.match(/@keyframes\s+([^\s{]+)/);
    return match && match[1];
}).filter(Boolean);
assert(scopedKeyframes.length === 2 && scopedKeyframes[0] !== scopedKeyframes[1], 'same-name keyframes from concurrent tracks must not collide');
animationRenderer.destroy();

const pRegionAnimationText = scrollingText.replace(
    '<p region="r1" begin="0s" end="10s"><span region="r2">scrolling<br/>second line</span><span region="r3">other region</span><span region="r2" style="s3"> sibling</span></p>',
    '<p region="r2" begin="0s" end="10s">p region animation</p>'
);
const pAnimationMedia = document.createElement('video');
Object.defineProperty(pAnimationMedia, 'currentTime', {value: 0, writable: true});
const pAnimationOverlay = document.createElement('div');
sizeOverlay(pAnimationOverlay);
document.body.append(pAnimationMedia, pAnimationOverlay);
const pAnimationRenderer = new B62TTMLRenderer({mediaElement: pAnimationMedia, overlayElement: pAnimationOverlay, fallbackStrokeColor: false});
pAnimationRenderer.push({packetId: 8, text: pRegionAnimationText});
assert(pAnimationOverlay.querySelector('.ttml-subtitle-line').style.animationName.startsWith('aribb62-'), 'a p region animation must be applied to its content layer');
pAnimationRenderer.destroy();

const spanOnlyRegionText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling">
  <head><layout><region xml:id="only" tts:origin="40px 40px" tts:extent="300px 100px"/></layout></head>
  <body><div><p begin="0s" end="10s"><span region="only">span only</span></p></div></body>
</tt>`;
const spanOnlyMedia = document.createElement('video');
Object.defineProperty(spanOnlyMedia, 'currentTime', {value: 0, writable: true});
const spanOnlyOverlay = document.createElement('div');
sizeOverlay(spanOnlyOverlay);
document.body.append(spanOnlyMedia, spanOnlyOverlay);
const spanOnlyRenderer = new B62TTMLRenderer({mediaElement: spanOnlyMedia, overlayElement: spanOnlyOverlay, fallbackStrokeColor: false, smallScreenScale: false});
spanOnlyRenderer.push({packetId: 6, text: spanOnlyRegionText});
const spanOnly = spanOnlyOverlay.querySelector('[data-aribb62-region-group]');
assert(Math.abs(spanOnly.getBoundingClientRect().left - spanOnlyOverlay.getBoundingClientRect().left - 4) < 1, 'a span-only region must use plane coordinates without the legacy fallback box');
assert(spanOnly.style.textAlign === 'start', 'an explicit span region must start at its operation-position origin');
spanOnlyRenderer.destroy();

const defaultAlignmentText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling">
  <head><layout><region xml:id="default-align" tts:origin="0px 0px" tts:extent="1000px 200px"/></layout></head>
  <body><div><p region="default-align" begin="0s" end="10s">centered by default</p></div></body>
</tt>`;
const defaultAlignmentMedia = document.createElement('video');
Object.defineProperty(defaultAlignmentMedia, 'currentTime', {value: 0, writable: true});
const defaultAlignmentOverlay = document.createElement('div');
sizeOverlay(defaultAlignmentOverlay);
document.body.append(defaultAlignmentMedia, defaultAlignmentOverlay);
const defaultAlignmentRenderer = new B62TTMLRenderer({
    mediaElement: defaultAlignmentMedia,
    overlayElement: defaultAlignmentOverlay,
    fallbackStrokeColor: false
});
defaultAlignmentRenderer.push({packetId: 9, text: defaultAlignmentText});
const defaultAlignmentBlock = defaultAlignmentOverlay.querySelector('.ttml-subtitle-block');
assert(defaultAlignmentBlock.style.textAlign === 'center', 'paragraph textAlign must default to the libaribcaption-compatible center');
assert(defaultAlignmentBlock.style.alignItems === 'center', 'default paragraph flow must be centered inside its region');
defaultAlignmentRenderer.destroy();

const smallScreenText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling" tts:extent="3840px 2160px">
  <head><styling>
    <style xml:id="main" tts:fontSize="144px 144px" tts:lineHeight="240px"/>
    <style xml:id="reading" tts:fontSize="72px 72px" tts:lineHeight="120px"/>
  </styling><layout>
    <region xml:id="reading-region" tts:origin="1000px 1680px" tts:extent="480px 120px"/>
    <region xml:id="main-region" tts:origin="680px 1800px" tts:extent="2400px 240px"/>
  </layout></head>
  <body><div><p region="reading-region" begin="0s" end="10s"><span style="reading">スキルブック</span></p>
    <p region="main-region" begin="0s" end="10s"><span style="main">小画面でも読みやすい字幕</span></p></div></body>
</tt>`;
const smallScreenMedia = document.createElement('video');
Object.defineProperty(smallScreenMedia, 'currentTime', {value: 0, writable: true});
const smallScreenOverlay = document.createElement('div');
smallScreenOverlay.style.position = 'relative';
smallScreenOverlay.style.width = '910px';
smallScreenOverlay.style.height = '512px';
document.body.append(smallScreenMedia, smallScreenOverlay);
const smallScreenRenderer = new B62TTMLRenderer({
    mediaElement: smallScreenMedia,
    overlayElement: smallScreenOverlay,
    fallbackStrokeColor: false
});
smallScreenRenderer.push({packetId: 10, text: smallScreenText});
const smallScreenBlocks = smallScreenOverlay.querySelectorAll('.ttml-subtitle-block');
const readingFontSize = parseFloat(smallScreenBlocks[0].querySelector('span').style.fontSize);
const mainFontSize = parseFloat(smallScreenBlocks[1].querySelector('span').style.fontSize);
assert(readingFontSize >= 21 && mainFontSize >= 42, 'small-screen scaling must enlarge both readings and main text');
assert(Math.abs(parseFloat(smallScreenBlocks[1].style.left) - 161.067) < 1, 'small-screen scaling must preserve a left-side caption origin');
assert(parseFloat(smallScreenBlocks[1].style.top) < 427, 'bottom anchoring must lift the final line away from controls');
smallScreenRenderer.destroy();

const exactTinyMedia = document.createElement('video');
Object.defineProperty(exactTinyMedia, 'currentTime', {value: 0, writable: true});
const exactTinyOverlay = document.createElement('div');
sizeOverlay(exactTinyOverlay);
document.body.append(exactTinyMedia, exactTinyOverlay);
const exactTinyRenderer = new B62TTMLRenderer({
    mediaElement: exactTinyMedia,
    overlayElement: exactTinyOverlay,
    fallbackStrokeColor: false,
    smallScreenScale: false
});
exactTinyRenderer.push({packetId: 11, text: smallScreenText});
const exactTinyBlocks = exactTinyOverlay.querySelectorAll('.ttml-subtitle-block');
const exactReadingFontSize = parseFloat(exactTinyBlocks[0].querySelector('span').style.fontSize);
const exactMainFontSize = parseFloat(exactTinyBlocks[1].querySelector('span').style.fontSize);
assert(Math.abs(exactReadingFontSize - 7.2) < 0.1, 'exact scaling must not clamp a 72px reading independently');
assert(Math.abs(exactMainFontSize - 14.4) < 0.1, 'exact scaling must preserve the main-to-reading size ratio');
exactTinyRenderer.destroy();

const readableTinyRenderer = new B62TTMLRenderer({
    mediaElement: exactTinyMedia,
    overlayElement: exactTinyOverlay,
    fallbackStrokeColor: false
});
readableTinyRenderer.push({packetId: 12, text: smallScreenText});
const readableTinyBlocks = exactTinyOverlay.querySelectorAll('.ttml-subtitle-block');
const readableTinyReading = parseFloat(readableTinyBlocks[0].querySelector('span').style.fontSize);
const readableTinyMain = parseFloat(readableTinyBlocks[1].querySelector('span').style.fontSize);
assert(readableTinyReading >= 14.3, 'very small screens must keep 72px readings legible');
assert(readableTinyMain >= 28.7, 'very small screens must keep 144px main captions legible');
readableTinyRenderer.destroy();

const branchingBackgroundText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling" tts:extent="3840px 2160px">
  <head><styling>
    <style xml:id="reading-bg" tts:fontSize="72px 72px" tts:lineHeight="120px" tts:backgroundColor="#00000080"/>
    <style xml:id="main-bg" tts:fontSize="144px 144px" tts:lineHeight="240px" tts:backgroundColor="#00000080"/>
  </styling><layout>
    <region xml:id="reading-a" tts:origin="1240px 1680px" tts:extent="160px 120px"/>
    <region xml:id="reading-b" tts:origin="1560px 1680px" tts:extent="160px 120px"/>
    <region xml:id="reading-c" tts:origin="1880px 1680px" tts:extent="160px 120px"/>
    <region xml:id="main-bg-region" tts:origin="1240px 1800px" tts:extent="1920px 240px"/>
  </layout></head>
  <body><div>
    <p region="reading-a"><span style="reading-bg">いぶ</span></p>
    <p region="reading-b"><span style="reading-bg">くる</span></p>
    <p region="reading-c"><span style="reading-bg">きば</span></p>
    <p region="main-bg-region"><span style="main-bg">燻り狂う牙の「技能の書」≫</span></p>
  </div></body>
</tt>`;
const branchingBackgroundMedia = document.createElement('video');
const branchingBackgroundOverlay = document.createElement('div');
sizeOverlay(branchingBackgroundOverlay);
document.body.append(branchingBackgroundMedia, branchingBackgroundOverlay);
const branchingBackgroundRenderer = new B62TTMLRenderer({
    mediaElement: branchingBackgroundMedia,
    overlayElement: branchingBackgroundOverlay,
    fallbackStrokeColor: false,
    lineBackground: true,
    smallScreenScale: false
});
branchingBackgroundRenderer.push({packetId: 13, text: branchingBackgroundText});
const branchingBackgroundPath = branchingBackgroundOverlay.querySelector('.ttml-subtitle-background-layer path');
assert(branchingBackgroundPath, 'branching reading backgrounds must render in the SVG background layer');
assert((branchingBackgroundPath.getAttribute('d').match(/\bM\b/g) || []).length === 4,
    'disjoint readings must remain separate background subpaths above the main line');
branchingBackgroundRenderer.destroy();

const verticalRegionText = `
<tt xmlns="http://www.w3.org/ns/ttml" xmlns:tts="http://www.w3.org/ns/ttml#styling">
  <head><layout><region xml:id="vertical" tts:writingMode="tbrl" tts:origin="400px 40px" tts:extent="100px 200px"/></layout></head>
  <body><div><p begin="0s" end="10s"><span region="vertical">縦書</span></p></div></body>
</tt>`;
const verticalAnchorMedia = document.createElement('video');
Object.defineProperty(verticalAnchorMedia, 'currentTime', {value: 0, writable: true});
const verticalAnchorOverlay = document.createElement('div');
sizeOverlay(verticalAnchorOverlay);
document.body.append(verticalAnchorMedia, verticalAnchorOverlay);
const verticalAnchorRenderer = new B62TTMLRenderer({mediaElement: verticalAnchorMedia, overlayElement: verticalAnchorOverlay, fallbackStrokeColor: false, smallScreenScale: false});
verticalAnchorRenderer.push({packetId: 7, text: verticalRegionText});
const verticalSpan = verticalAnchorOverlay.querySelector('[data-aribb62-region-group]');
const verticalBlock = verticalSpan.getBoundingClientRect();
assert(Math.abs(verticalBlock.right - verticalAnchorOverlay.getBoundingClientRect().left - 40) < 1, 'vertical span region origin must anchor the right edge');
assert(getComputedStyle(verticalSpan).writingMode === 'vertical-rl', 'a span region must apply its vertical writing mode');
verticalAnchorRenderer.destroy();

document.getElementById('result').textContent = 'PASS';
</script>
